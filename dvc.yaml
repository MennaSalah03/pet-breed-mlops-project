   # dvc.yaml
   stages:
     corrupt:
       cmd: python data_modification/corrupt_test_data.py
       deps:
         - data/images
         - data/oxford-iiit-pet/annotations/test.txt
         - data_modification/corrupt_test_data.py
       outs:
         - data/oxford-iiit-pet/corrupted_images

     manifest:
       cmd: python data_modification/create_manifest.py
       deps:
         - data/oxford-iiit-pet/images
         - data/oxford-iiit-pet/corrupted_images
         - data/oxford-iiit-pet/annotations/test.txt
         - data/oxford-iiit-pet/annotations/trainval.txt
         - data_modification/create_manifest.py
       outs:
         - data/oxford-iiit-pet/manifest.json
